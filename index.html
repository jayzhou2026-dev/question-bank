<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3eb" />
    <title>变电运维刷题</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">竞赛理论题库</p>
          <h1>变电运维刷题</h1>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="打开设置">⚙</button>
      </header>

      <main>
        <section class="dashboard" id="dashboardView">
          <div class="hero-panel">
            <div>
              <p class="muted">今日进度</p>
              <h2 id="heroTitle">开始刷题</h2>
              <p id="heroSubtitle">题库正在加载...</p>
            </div>
            <button class="primary-button" id="continueButton" type="button">继续练习</button>
          </div>

          <div class="stats-grid" aria-label="学习统计">
            <div class="stat-card">
              <span>已做</span>
              <strong id="doneCount">0</strong>
            </div>
            <div class="stat-card">
              <span>正确率</span>
              <strong id="accuracyRate">0%</strong>
            </div>
            <div class="stat-card">
              <span>错题</span>
              <strong id="wrongCount">0</strong>
            </div>
            <div class="stat-card">
              <span>收藏</span>
              <strong id="favoriteCount">0</strong>
            </div>
          </div>

          <div class="mode-grid">
            <button class="mode-card" type="button" data-mode="sequential">
              <span>顺序刷题</span>
              <small>从上次位置继续</small>
            </button>
            <button class="mode-card" type="button" data-mode="random">
              <span>随机练习</span>
              <small>打乱题目顺序</small>
            </button>
            <button class="mode-card" type="button" data-mode="wrong">
              <span>错题复习</span>
              <small>集中复盘答错题</small>
            </button>
            <button class="mode-card" type="button" data-mode="favorite">
              <span>收藏题</span>
              <small>复习手动标记题</small>
            </button>
            <button class="mode-card wide" type="button" id="examButton">
              <span>模拟考试</span>
              <small>随机 100 题，交卷看成绩</small>
            </button>
          </div>

          <div class="filter-row">
            <label>
              题型
              <select id="typeFilter">
                <option value="all">全部题型</option>
                <option value="单选题">单选题</option>
                <option value="多选题">多选题</option>
                <option value="判断题">判断题</option>
              </select>
            </label>
          </div>
        </section>

        <section class="practice hidden" id="practiceView" aria-live="polite">
          <div class="practice-head">
            <button class="ghost-button" id="backButton" type="button">返回</button>
            <div>
              <p id="modeLabel">练习</p>
              <strong id="progressLabel">0 / 0</strong>
            </div>
            <button class="ghost-button" id="favoriteButton" type="button">收藏</button>
          </div>

          <div class="question-panel">
            <div class="question-meta">
              <span id="questionType">题型</span>
              <span id="questionDifficulty">难度</span>
            </div>
            <h2 id="questionStem">题目加载中...</h2>
            <div class="options-list" id="optionsList"></div>
            <div class="result-panel hidden" id="resultPanel"></div>
          </div>

          <div class="action-bar">
            <button class="ghost-button" id="prevButton" type="button">上一题</button>
            <button class="primary-button" id="submitButton" type="button">提交答案</button>
            <button class="ghost-button" id="nextButton" type="button">下一题</button>
          </div>
        </section>

        <section class="settings hidden" id="settingsView">
          <div class="settings-head">
            <button class="ghost-button" id="settingsBackButton" type="button">返回</button>
            <h2>设置</h2>
          </div>
          <div class="settings-list">
            <div class="setting-item">
              <div>
                <strong>导出学习记录</strong>
                <p>保存错题、收藏、做题次数和考试记录。</p>
              </div>
              <button class="secondary-button" id="exportButton" type="button">导出</button>
            </div>
            <div class="setting-item">
              <div>
                <strong>导入学习记录</strong>
                <p>从备份文件恢复到当前浏览器。</p>
              </div>
              <label class="secondary-button file-button">
                导入
                <input id="importInput" type="file" accept="application/json" />
              </label>
            </div>
            <div class="setting-item danger">
              <div>
                <strong>清空学习记录</strong>
                <p>只清空本机记录，不影响题库。</p>
              </div>
              <button class="danger-button" id="resetButton" type="button">清空</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
